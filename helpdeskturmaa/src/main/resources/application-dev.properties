spring.application.name=helpdesk

# MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk
spring.datasource.username=root
spring.datasource.password=

# Driver (Boot 2.7 gerencia; manter explícito ajuda)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
# use 'create' na 1ª vez para criar as tabelas; depois troque para 'none'
spring.jpa.hibernate.ddl-auto=create
# spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Opcional (dialeto detectado automaticamente, mas pode ajudar)
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect