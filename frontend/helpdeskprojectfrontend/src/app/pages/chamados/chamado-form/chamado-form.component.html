<mat-card>
  <mat-card-title>
    {{ isEdit ? 'Editar Chamado' : 'Novo Chamado' }}
  </mat-card-title>

  <form [formGroup]="form" (ngSubmit)="salvar()">
    <mat-card-content>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Título</mat-label>
        <input matInput formControlName="titulo" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Observações</mat-label>
        <textarea matInput formControlName="observacoes" rows="4"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let s of statusOptions" [value]="s">
            {{ s }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Prioridade</mat-label>
        <mat-select formControlName="prioridade">
          <mat-option *ngFor="let p of prioridadeOptions" [value]="p">
            {{ p }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>ID do Técnico</mat-label>
        <input matInput type="number" formControlName="tecnicoId">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>ID do Cliente</mat-label>
        <input matInput type="number" formControlName="clienteId">
      </mat-form-field>

    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Salvar
      </button>
      <button mat-button type="button" (click)="cancelar()">
        Cancelar
      </button>
    </mat-card-actions>
  </form>
</mat-card>
