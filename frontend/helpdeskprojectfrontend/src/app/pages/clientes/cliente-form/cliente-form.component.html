<mat-card>
  <mat-card-title>
    {{ isEdit ? 'Editar Cliente' : 'Novo Cliente' }}
  </mat-card-title>

  <form [formGroup]="form" (ngSubmit)="salvar()">
    <mat-card-content>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" required>
        <mat-error *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched">
          Informe o nome do cliente.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>CPF/CNPJ</mat-label>
        <input matInput formControlName="cpfOuCnpj" required>
        <mat-error *ngIf="form.get('cpfOuCnpj')?.invalid && form.get('cpfOuCnpj')?.touched">
          Informe o CPF ou CNPJ.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>E-mail</mat-label>
        <input matInput formControlName="email" type="email" required>
        <mat-error *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Informe um e-mail válido.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Senha</mat-label>
        <input matInput formControlName="senha" type="password">
      </mat-form-field>

    </mat-card-content>

    <mat-card-actions>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="form.invalid">
        Salvar
      </button>

      <button
        mat-button
        type="button"
        (click)="cancelar()">
        Cancelar
      </button>
    </mat-card-actions>
  </form>
</mat-card>
